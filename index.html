<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf9f6" />
    <!-- Standalone ar sedan landningssidan en PUBLIK sida och maste ga att
         hitta. Raden hette tidigare noindex, nofollow, noarchive, vilket var
         ratt sa lange hela adressen bara var en inloggningsruta men gjorde
         produkten osynlig for varje sokning i samma sekund den fick ett
         skyltfonster. Husbyggena (essensia, linnartistry) far tillbaka
         noindex av vite-pluginet, eftersom de ar privata installationer hos
         en kund och inte nagot som ska ligga i Googles index. -->
    <meta name="robots" content="index, follow" />
    <title>Piches, koll på licenserna i dina UGC-uppdrag</title>
    <meta
      name="description"
      content="Piches håller reda på hur länge varje varumärke får använda ditt material, säger till innan licensen går ut och räknar ut vad förlängningen är värd. Prova 14 dagar gratis utan kort."
    />
    <link rel="canonical" href="https://piches.essensiadesign.se/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Piches" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:url" content="https://piches.essensiadesign.se/" />
    <meta property="og:title" content="Du vet vad du fick betalt. Vet du hur länge de får använda det?" />
    <meta
      property="og:description"
      content="Ett UGC-uppdrag är en licens med en klocka i. Piches håller reda på klockan, från första förfrågan till den dag rättigheten går ut."
    />
    <!-- og:image saknas med flit. Delningsbilden ska goras i Canva som all
         annan varumarkesgrafik, och en trasig bildlank ser samre ut an ingen
         bild alls. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Du vet vad du fick betalt. Vet du hur länge de får använda det?" />
    <meta
      name="twitter:description"
      content="Piches håller reda på licensklockan i dina UGC-uppdrag och säger till innan den går ut."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
